<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clients Manager</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="telaPin">
  <div class="form">
    <h2>Clients Manager</h2>
    <label>Usuário</label>
    <input id="loginUsuario" placeholder="Digite seu usuário" autocomplete="username">
    <label>Senha</label>
    <input type="password" id="pinInput" placeholder="Digite sua senha" autocomplete="current-password">
    <label class="check-linha"><input type="checkbox" id="verSenhaLogin" onclick="document.getElementById('pinInput').type = this.checked ? 'text' : 'password'"> Ver senha</label>
    <br><button onclick="entrar()">Entrar</button>
  </div>
</div>

<header>
  <h1>Clients Manager</h1>
  <button class="sec" onclick="exportarBackup(db)">Backup</button>
  <button class="sec" onclick="document.getElementById('impBackup').click()">Restaurar</button>
  <input type="file" id="impBackup" accept=".json" hidden>
  <div class="menu-wrap">
    <button class="sec menu-btn" onclick="toggleMenu(event)" title="Menu">⋯</button>
    <div class="dropdown" id="dropdown" style="display:none;">
      <button id="btnUsuarios" onclick="abrirModalUsuarios()">Usuários</button>
      <button onclick="abrirModalSenha()">Senha (ver / mudar)</button>
      <button onclick="mudarTema()"><span id="icoTema">🌙</span> Tema: <span id="lblTema">Escuro</span></button>
      <button onclick="logout()">Deslogar</button>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <button class="sec" id="btnFiltro" onclick="abrirPainelFiltro()" title="Filtros e busca">
      <span class="icon-filtro">▤</span> Filtros
    </button>
    <button onclick="abrirForm()">+ Aluno</button>
    <button class="sec" onclick="abrirModal('modalImp')">Importar planilha</button>
    <button class="sec" onclick="carregarDemo()">Demo</button>
  </div>

  <div id="painelFiltro" style="display:none; background:var(--card); padding:12px; border-radius:12px; margin-bottom:12px;">
    <div class="toolbar">
      <input id="busca" placeholder="Buscar nome ou responsável..." oninput="buscaDigitada()">
      <select id="filtroStatus">
        <option value="">Todos os status</option>
        <option>Já Pagou</option><option>Aguardando</option><option>Pendente</option>
      </select>
      <select id="filtroOrdem">
        <option value="AZ">A-Z</option>
        <option value="ZA">Z-A</option>
        <option value="novos">Mais novos</option>
        <option value="antigos">Mais antigos</option>
      </select>
      <select id="filtroTurno">
        <option value="">Todos os turnos</option>
        <option>Manhã</option><option>Tarde</option>
      </select>
      <select id="filtroIdade">
        <option value="">Todas as idades</option>
        <option value="at6">Até 6 anos</option>
        <option value="7a9">7 a 9 anos</option>
        <option value="10a12">10 a 12 anos</option>
        <option value="13mais">13+ anos</option>
      </select>
      <select id="filtroMatricula">
        <option value="">Todas matrículas</option>
        <option>Aguardando</option><option>Válido</option><option>Cancelado</option>
      </select>
      <select id="filtroRecentes">
        <option value="">Qualquer data</option>
        <option value="7">Adicionados há 7 dias</option>
        <option value="30">Adicionados há 30 dias</option>
      </select>
      <select id="filtroInscricao">
        <option value="">Todas as inscrições</option>
        <option value="completa">Completa</option>
        <option value="incompleta">Faltando dados</option>
      </select>
    </div>
    <div class="toolbar" style="margin-bottom:0;">
      <button onclick="aplicarFiltros()">Aplicar</button>
      <button class="sec" onclick="limparFiltros()">Limpar</button>
      <span id="contador" style="align-self:center; color:var(--mut); margin-left:auto;"></span>
    </div>
  </div>

  <table><thead><tr>
    <th>Aluno</th><th>Responsável</th><th>Treino</th>
    <th>Data da mensalidade</th><th>Mensalidade</th><th>Matrícula</th><th></th>
  </tr></thead><tbody id="lista"></tbody></table>
</main>

<div class="modal" id="modalForm"><div class="form">
  <h3 id="formTitulo">Aluno</h3>
  <input type="hidden" id="fId">
  <label>Nome completo</label><input id="fNome">
  <div class="linha">
    <div><label>Nascimento</label><input type="date" id="fNasc"></div>
    <div><label>Data da mensalidade (dia do mês, 1-31)</label><input type="number" id="fVenc" min="1" max="31"></div>
  </div>
  <label>Responsável</label><input id="fResp">
  <label>Contato emergência</label><input id="fContato">
  <label>Endereço</label><input id="fEnd">
  <label>Histórico médico / observação</label><textarea id="fHist" rows="2"></textarea>
  <div class="linha">
    <div>
      <label>Dias de treino (marque e confirme)</label>
      <div id="diasCheck" class="dias-check">
        <label class="dia-check"><input type="checkbox" value="Segunda"> Seg</label>
        <label class="dia-check"><input type="checkbox" value="Terça"> Ter</label>
        <label class="dia-check"><input type="checkbox" value="Quarta"> Qua</label>
        <label class="dia-check"><input type="checkbox" value="Quinta"> Qui</label>
        <label class="dia-check"><input type="checkbox" value="Sexta"> Sex</label>
        <label class="dia-check"><input type="checkbox" value="Sábado"> Sáb</label>
        <label class="dia-check"><input type="checkbox" value="Domingo"> Dom</label>
      </div>
      <label>Turno</label>
      <select id="fTurno">
        <option>Tarde</option>
        <option>Manhã</option>
        <option>Noite</option>
      </select>
    </div>
    <div><label>Matrícula</label><select id="fMat">
      <option>Aguardando</option><option>Válido</option><option>Cancelado</option>
    </select></div>
  </div>
  <div class="linha">
    <div id="grupoPag" style="display:none;"><label>Último pagamento</label><input type="date" id="fPag"></div>
    <div><label>Direito de uso de imagem</label><select id="fImg">
      <option value="autorizado">Autorizado</option>
      <option value="nao">Não autorizado</option>
      <option value="na" selected>N/A</option>
    </select></div>
  </div>
  <br><div class="linha">
    <button onclick="salvarForm()">Salvar</button>
    <button class="sec" onclick="marcarPagoHoje()">Pago hoje</button>
    <button class="sec" onclick="fecharModal('modalForm')">Fechar</button>
  </div>
  <div id="grupoRemover" style="display:none; margin-top:12px;">
    <button class="danger" onclick="remover(editando)">Remover aluno</button>
  </div>
</div></div>

<div class="modal" id="modalImp"><div class="form">
  <h3>Importar da planilha</h3>
  <label>Colar link do CSV publicado</label>
  <input id="impLink" placeholder="https://docs.google.com/...output=csv">
  <br><br><button onclick="importarLink()">Puxar do link</button>
  <hr><label>Ou enviar arquivo CSV</label>
  <input type="file" id="impCSV" accept=".csv">
  <br><br><button class="sec" onclick="fecharModal('modalImp')">Fechar</button>
</div></div>

<div class="modal" id="modalSenha"><div class="form">
  <h3>Senha de acesso</h3>
  <label>Senha atual (caso tenha esquecido)</label>
  <div class="linha">
    <input type="password" id="senhaAtual" readonly>
    <button class="sec" onclick="toggleOlho('senhaAtual')">👁</button>
  </div>
  <label>Nova senha (4+ dígitos)</label><input type="password" id="novaSenha">
  <label>Confirmar nova senha</label><input type="password" id="novaSenha2">
  <br><br>
  <button onclick="salvarSenha()">Salvar nova senha</button>
  <button class="sec" onclick="fecharModal('modalSenha')">Fechar</button>
</div></div>

<div class="modal" id="modalUsuarios"><div class="form">
  <h3>Usuários</h3>
  <p style="color:var(--mut);">Logado como: <b id="quemLogado" style="color:var(--txt);"></b></p>
  <div id="listaUsuarios"></div>
  <hr style="border-color:var(--line);">
  <label>Novo usuário</label><input id="novoUserNome" placeholder="Ex: secretaria">
  <label>Senha (4+ dígitos)</label><input type="password" id="novoUserSenha" placeholder="Senha do novo usuário">
  <br><br>
  <div class="linha">
    <button onclick="adicionarUsuario()">Adicionar</button>
    <button class="sec" onclick="fecharModal('modalUsuarios')">Fechar</button>
  </div>
</div></div>

<div class="modal" id="modalConfirm"><div class="form" style="width:360px;">
  <h3>Confirmação</h3>
  <p id="confirmMsg" style="margin:12px 0;"></p>
  <div class="linha">
    <button class="danger" onclick="cliqueSim()">Sim</button>
    <button class="sec" onclick="cliqueNao()">Não</button>
  </div>
</div></div>

<div class="modal" id="modalAviso"><div class="form" style="width:360px;">
  <h3>Acesso bloqueado</h3>
  <p id="avisoMsg" style="margin:12px 0;"></p>
  <div class="linha">
    <button onclick="fecharModal('modalAviso')">Entendi</button>
  </div>
</div></div>

<script src="status.js"></script>
<script src="storage.js"></script>
<script src="import.js"></script>
<script src="dados-exemplo.js"></script>
<script src="app.js"></script>
</body>
</html>
